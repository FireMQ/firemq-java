name: Publish

# Deploys firemq-parent, firemq-client and firemq-kotlin to Maven Central through the
# Sonatype Central Portal when a version tag such as v0.1.0 is pushed. To publish a tag
# that already exists, run the workflow by hand and pass the tag.
#
# Skipped until the MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY
# and MAVEN_GPG_PASSPHRASE secrets are available to this repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  token:
    name: Check for the Maven Central secrets
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=""
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not set:$missing; skipping the Maven Central deploy"
          fi

  publish:
    name: Deploy to Maven Central
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      # The pushed tag, or the tag passed to a manual run.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      # Writes a settings.xml with a server "central" that reads its credentials from the
      # MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD environment variables.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Check that the tag matches the POM version
        run: |
          version="$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the POM version $version"
            exit 1
          fi

      - name: Unit tests
        run: mvn -B verify

      # The release profile builds the sources and javadoc jars, signs every artifact with
      # the Bouncy Castle signer (key and passphrase from MAVEN_GPG_KEY and
      # MAVEN_GPG_PASSPHRASE, no gpg agent) and uploads the bundle to the Central Portal,
      # which publishes it once it passes validation.
      - name: Deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -P release -DskipTests deploy
